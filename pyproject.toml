[project]
name = "trading-bot"
version = "0.1.0"
description = "Crypto trading bot with AI integration"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    # Core
    "ccxt>=4.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0.48",
    "alembic>=1.18",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "structlog>=24.0",
    "apscheduler>=3.10",
    "python-telegram-bot>=21.0",
    # Technical analysis
    "pandas-ta-classic>=0.1",
    # Backtesting
    "vectorbt>=0.26",
    "backtesting>=0.3",
    # ML
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "optuna>=3.6",
    # AI
    "torch>=2.2",
    "transformers>=4.36",
    "anthropic>=0.25",
    "openai>=1.12",
    "stable-baselines3>=2.3",
    "gymnasium>=0.29",
    # Data
    "aiohttp>=3.9",
    "httpx>=0.27",
    # Metrics
    "quantstats>=0.0.62",
    # Portfolio
    "riskfolio-lib>=7.0",
    # Dashboard
    "streamlit>=1.32",
    "plotly>=5.18",
    # DB driver
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
]

[project.scripts]
trading-bot = "trading_bot.cli:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.98",
    "ruff>=0.3",
    "mypy>=1.9",
    "pre-commit>=3.6",
]
ta-lib = [
    "TA-Lib>=0.4",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.lint.isort]
known-first-party = ["trading_bot"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "ccxt.*", "vectorbt.*", "backtesting.*", "lightgbm.*",
    "optuna.*", "transformers.*", "stable_baselines3.*",
    "gymnasium.*", "quantstats.*", "riskfolio.*", "streamlit.*",
    "plotly.*", "telegram.*", "pandas_ta_classic.*", "talib.*",
    "apscheduler.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "ai: marks AI module tests",
]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_bot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
