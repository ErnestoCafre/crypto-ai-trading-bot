[project]
name = "trading-bot"
version = "0.1.0"
description = "Crypto trading bot with AI integration"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    # Core
    # Upper bound: a major release may change how stopLossPrice maps to
    # Binance STOP_LOSS (live native stops). Re-check before raising it.
    "ccxt>=4.5,<5",
    "pandas>=2.2,<3",
    # numpy 2.5 deprecated the "generic" timedelta64 unit (future error) and
    # pandas 2.3 still uses it internally; 2.6+ is untested with pandas<3.
    "numpy>=1.26,<2.6",
    "sqlalchemy[asyncio]>=2.0.48,<2.2",
    "alembic>=1.18",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "apscheduler>=3.10,<4",
    # Technical analysis
    "pandas-ta-classic>=0.8.32",
    # ML
    "scikit-learn>=1.4",
    "lightgbm>=4.7",
    "optuna>=4.0,<6",
    # LLM agents (anthropic 1.x runs on httpx2, not httpx)
    "anthropic>=1.9,<2",
    "openai>=1.12,<3",
    # Data
    "httpx>=0.27",
    # Metrics
    "quantstats>=0.0.62",
    # Dashboard
    "streamlit>=1.50",
    "plotly>=5.18",
    # DB driver (URLs are rewritten to postgresql+asyncpg://)
    "asyncpg>=0.29",
]

[project.scripts]
trading-bot = "trading_bot.cli:run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    # Tests build anthropic 1.x errors/transports from httpx2 objects.
    "httpx2>=2.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.98",
    "ruff>=0.15",
    "mypy>=1.19",
    "pre-commit>=3.6",
]
ta-lib = [
    "TA-Lib>=0.4",
]
# Transformer sentiment (USE_SENTIMENT=true): transformers needs torch as backend.
sentiment = [
    "transformers>=4.36",
    "torch>=2.2",
]
# Planned deep-learning predictors (GRU / CNN-LSTM stubs).
dl = [
    "torch>=2.2",
]
# Planned reinforcement-learning agent (stubs).
rl = [
    "stable-baselines3>=2.3",
    "gymnasium>=0.29",
]

[tool.uv]
# ccxt pins urllib3 to the exact release current when it was published;
# override it to pick up security fixes (CVE-2026-97689, fixed in 2.8.0).
override-dependencies = ["urllib3>=2.8"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "TID",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# ADR-005: indicators come from pandas_ta_classic; metrics from quantstats.
"pandas_ta".msg = "Use pandas_ta_classic (ADR-005)."
"pyfolio".msg = "Unmaintained; use quantstats (ADR-005)."
"empyrical".msg = "Unmaintained; use quantstats (ADR-005)."

[tool.ruff.lint.isort]
known-first-party = ["trading_bot"]

[tool.ruff.format]
quote-style = "double"
# Code blocks in the docs are illustrative specs, not source.
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "ccxt.*", "lightgbm.*",
    "optuna.*", "transformers.*", "quantstats.*", "streamlit.*",
    "plotly.*", "pandas_ta_classic.*",
    "apscheduler.*", "pandas", "pandas.*", "sklearn", "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "ai: marks AI module tests",
]
addopts = "-v --tb=short"
# Deprecations raised from our own code fail the suite: they become errors
# in a later library release (e.g. numpy timedelta64 generic unit).
filterwarnings = [
    "error::DeprecationWarning:trading_bot",
    "error::FutureWarning:trading_bot",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trading_bot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
