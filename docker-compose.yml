services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trading_bot
      POSTGRES_PASSWORD: trading_bot
      POSTGRES_DB: trading_bot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  bot:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://trading_bot:trading_bot@db:5432/trading_bot
    restart: unless-stopped

  dashboard:
    build: .
    command: ["streamlit", "run", "src/trading_bot/dashboard/app.py", "--server.port=8501"]
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://trading_bot:trading_bot@db:5432/trading_bot
    ports:
      - "8501:8501"

volumes:
  pgdata:
